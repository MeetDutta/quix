services:
  # ==========================================
  # EduQuizX Backend Service (FastAPI + AI RAG)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduquizx-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///quiz.db}
      - SECRET_KEY=${SECRET_KEY:-default_secret_key_change_in_production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,*
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-no-reply@eduquizx.com}
      - EMAILS_FROM_NAME=${EMAILS_FROM_NAME:-EduQuizX Examination System}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - eduquizx-net

  # ==========================================
  # EduQuizX Frontend Service (Next.js 15 Standalone)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-716730043675-rq3tq97avgrrbtjoup3hjdhteg4k7pql.apps.googleusercontent.com}
    container_name: eduquizx-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-716730043675-rq3tq97avgrrbtjoup3hjdhteg4k7pql.apps.googleusercontent.com}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eduquizx-net

# ==========================================
# Network & Volume Definitions
# ==========================================
networks:
  eduquizx-net:
    driver: bridge

volumes:
  uploads_data:
    driver: local
  db_data:
    driver: local
